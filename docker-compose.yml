services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: compfinder_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: compfinder
      POSTGRES_USER: compfinder
      POSTGRES_PASSWORD: compfinder
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compfinder -d compfinder"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: compfinder_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: compfinder_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://compfinder:compfinder@postgres:5432/compfinder
      DATABASE_SYNC_URL: postgresql://compfinder:compfinder@postgres:5432/compfinder
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: compfinder_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://compfinder:compfinder@postgres:5432/compfinder
      DATABASE_SYNC_URL: postgresql://compfinder:compfinder@postgres:5432/compfinder
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.workers.search_worker"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: compfinder_frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
